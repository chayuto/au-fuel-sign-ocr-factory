[project]
name = "au-fuel-sign-ocr-factory"
version = "0.1.0"
description = "Real + synthetic data factory for Australian fuel sign OCR — YOLO26n Finder (4 classes) + 2 Reader Experts — mobile edge (<15MB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "albumentations>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
annotate = [
    "ultralytics>=8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
